
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | TY STYLE</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .product-detail {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .detail-image {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            border-radius: 12px;
        }

        .detail-info h1 {
            margin: 15px 0;
        }

        .detail-price {
            font-size: 25px;
            font-weight: 700;
            margin: 20px 0;
        }

        .detail-info select,
        .detail-info input {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 12px 0;
        }

        .detail-info button {
            width: 100%;
            padding: 15px;
            margin-top: 12px;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
            font-weight: bold;
        }

        .detail-description {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        @media(max-width: 700px) {
            .product-detail {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

    <div id="product-details">
        Loading product...
    </div>

    <script>
        let currentProduct = null;

        async function loadProduct() {

            const params = new URLSearchParams(window.location.search);
            const productId = Number(params.get("id"));

            try {

                const response = await fetch("/api/products");
                const products = await response.json();

                currentProduct = products.find(
                    product => Number(product.id) === productId
                );

                if (!currentProduct) {
                    document.getElementById("product-details").innerHTML =
                        "<h2>Product not found!</h2>";
                    return;
                }

                showProduct();

            } catch (error) {

                document.getElementById("product-details").innerHTML =
                    "<h2>Unable to load product.</h2>";

            }
        }

        function showProduct() {

            const product = currentProduct;

            const sizes = Array.isArray(product.sizes)
                ? product.sizes
                : [];

            document.getElementById("product-details").innerHTML = `

                <div class="product-detail">

                    <div>
                        <img
                            class="detail-image"
                            src="${product.image || ""}"
                            alt="${product.name || "Product"}"
                            onerror="this.src='https://placehold.co/700x900?text=TY+STYLE'"
                        >
                    </div>

                    <div class="detail-info">

                        <p>${product.category || ""}</p>

                        <h1>${product.name || "Product"}</h1>

                        <p class="detail-price">
                            Rs. ${Number(product.price || 0).toLocaleString("en-PK")}
                        </p>

                        <p>${product.stock ? "In Stock" : "Out of Stock"}</p>

                        <label>Select Size</label>

                        <select id="detail-size">
                            <option value="">Choose Size</option>
                            ${sizes.map(size =>
                                `<option value="${size}">${size}</option>`
                            ).join("")}
                        </select>

                        <label>Quantity</label>

                        <input
                            type="number"
                            id="detail-quantity"
                            value="1"
                            min="1"
                        >

                        <button onclick="detailBuyNow()">
                            BUY NOW
                        </button>

                        <button onclick="detailAddToCart()">
                            ADD TO CART
                        </button>

                    </div>

                </div>

                <div class="detail-description">

                    <h2>Product Description</h2>

                    <p>
                        Discover ${product.name} at TY STYLE.
                        Explore our ${product.category} collection
                        and upgrade your everyday style.
                    </p>

                </div>

            `;
        }

        function detailBuyNow() {

            const size = document.getElementById("detail-size").value;
            const quantity = Number(
                document.getElementById("detail-quantity").value
            );

            if (currentProduct.sizes?.length && !size) {
                alert("Please select a size.");
                return;
            }

            if (!Number.isInteger(quantity) || quantity < 1) {
                alert("Please enter a valid quantity.");
                return;
            }

            localStorage.setItem("tyStyleBuyNow", JSON.stringify({
                ...currentProduct,
                selectedSize: size,
                quantity: quantity
            }));

            window.location.href = "buy-now.html";
        }

        function detailAddToCart() {

            const size = document.getElementById("detail-size").value;

            if (currentProduct.sizes?.length && !size) {
                alert("Please select a size.");
                return;
            }

            if (typeof addToCart === "function") {
                addToCart(currentProduct.id);
            } else {
                alert("Cart is not connected on this page yet.");
            }
        }

        loadProduct();
    </script>

</body>
</html>
