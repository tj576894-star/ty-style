
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TY Style - Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 24px; }
        header span { color: #ccc; }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card, .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 { margin-bottom: 10px; }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        .section { margin-bottom: 25px; }
        .section h2 { margin-bottom: 20px; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin: 3px;
        }

        button:hover { opacity: 0.85; }

        .add-btn {
            background: #111;
            color: white;
            margin-top: 15px;
        }

        .product {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            gap: 10px;
        }

        .product:last-child { border-bottom: none; }

        .product-info h3 { margin-bottom: 5px; }
        .product-info p { color: #555; margin: 4px 0; }

        .stock { font-weight: bold; }
        .in-stock { color: green; }
        .out-stock { color: red; }

        .delete-btn {
            background: #d32f2f;
            color: white;
        }

        .order {
            border: 1px solid #ddd;
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .order h3 { margin-bottom: 8px; }
        .order p { margin: 7px 0; }

        .status-select {
            margin-top: 8px;
            max-width: 250px;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            margin-top: 12px;
        }

        @media (max-width: 700px) {
            .dashboard, .form-grid {
                grid-template-columns: 1fr;
            }

            header {
                padding: 18px;
                flex-direction: column;
                gap: 8px;
            }

            .product {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TY STYLE — Admin Panel</h1>
    <span>Store Management</span>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <h3>Total Products</h3>
            <p id="product-count">0</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p id="order-count">0</p>
        </div>

        <div class="card">
            <h3>Total Sales</h3>
            <p id="total-sales">Rs. 0</p>
        </div>

    </div>

    <div class="section">
        <h2>Add New Product</h2>

        <div class="form-grid">

            <input type="text" id="product-name" placeholder="Product Name">

            <input type="number" id="product-price" placeholder="Price">

            <select id="product-category">
                <option value="Hoodies">Hoodies</option>
                <option value="Shirts">Shirts</option>
                <option value="Pants">Pants</option>
                <option value="Sweatshirts">Sweatshirts</option>
            </select>

            <input type="text" id="product-size" placeholder="Sizes e.g. S,M,L,XL">

            <input type="text" id="product-image" placeholder="Product Image URL">

        </div>

        <button class="add-btn" onclick="addProduct()">
            Add Product
        </button>
    </div>

    <div class="section">
        <h2>Products</h2>
        <div id="products-list"></div>
    </div>

    <div class="section">
        <h2>Customer Orders</h2>
        <div id="orders-list"></div>
    </div>

</div>

<script>

let products = [];
let orders = [];


/* SAVE PRODUCTS */

async function saveProducts() {

    const response = await fetch("/api/products", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(products)
    });

    if (!response.ok) {
        alert("Products save nahi hue.");
        return false;
    }

    return true;
}


/* LOAD PRODUCTS */

async function loadProducts() {

    try {

        const response = await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Products load nahi hue");
        }

        products = await response.json();

        displayProducts();

    } catch (error) {

        console.error(error);

        alert("Products load nahi ho sake.");

    }
}


/* ADD PRODUCT */

async function addProduct() {

    const name = document.getElementById("product-name").value.trim();

    const price = Number(document.getElementById("product-price").value);

    const category = document.getElementById("product-category").value;

    const sizes = document.getElementById("product-size").value.trim();

    const image = document.getElementById("product-image").value.trim();

    if (!name || !price || price <= 0 || !sizes || !image) {

        alert("Product ki tamam information fill karo.");

        return;
    }

    const product = {
        id: Date.now(),
        name: name,
        price: price,
        category: category,
        sizes: sizes.split(",").map(size => size.trim()),
        image: image,
        stock: true
    };

    products.push(product);

    const saved = await saveProducts();

    if (!saved) {
        products.pop();
        return;
    }

    document.getElementById("product-name").value = "";
    document.getElementById("product-price").value = "";
    document.getElementById("product-size").value = "";
    document.getElementById("product-image").value = "";

    displayProducts();
}


/* DELETE PRODUCT */

async function deleteProduct(id) {

    const oldProducts = products;

    products = products.filter(product => product.id !== id);

    if (!await saveProducts()) {
        products = oldProducts;
        return;
    }

    displayProducts();
}


/* STOCK */

async function toggleStock(id) {

    const product = products.find(product => product.id === id);

    if (!product) return;

    product.stock = !product.stock;

    if (!await saveProducts()) {
        product.stock = !product.stock;
        return;
    }

    displayProducts();
}


/* EDIT PRICE */

async function editPrice(id) {

    const product = products.find(product => product.id === id);

    if (!product) return;

    const oldPrice = product.price;

    const newPrice = prompt("New price enter karo:", product.price);

    if (newPrice === null) return;

    if (newPrice.trim() === "" || isNaN(newPrice) || Number(newPrice) <= 0) {

        alert("Valid price enter karo.");

        return;
    }

    product.price = Number(newPrice);

    if (!await saveProducts()) {
        product.price = oldPrice;
        return;
    }

    displayProducts();
}


/* DISPLAY PRODUCTS */

function displayProducts() {

    const list = document.getElementById("products-list");

    list.innerHTML = "";

    products.forEach(product => {

        const div = document.createElement("div");

        div.className = "product";

        const safeSizes = Array.isArray(product.sizes)
            ? product.sizes.join(", ")
            : "";

        div.innerHTML = `
            <div class="product-info">

                <h3>${product.name}</h3>

                <p>Rs. ${product.price}</p>

                <p>Category: ${product.category}</p>

                <p>Sizes: ${safeSizes}</p>

                <p class="stock ${product.stock ? "in-stock" : "out-stock"}">
                    ${product.stock ? "IN STOCK" : "OUT OF STOCK"}
                </p>

            </div>

            <div>

                <button onclick="editPrice(${product.id})">
                    Edit Price
                </button>

                <button onclick="toggleStock(${product.id})">
                    ${product.stock ? "Out of Stock" : "Stock On"}
                </button>

                <button class="delete-btn" onclick="deleteProduct(${product.id})">
                    Delete
                </button>

            </div>
        `;

        list.appendChild(div);

    });

    document.getElementById("product-count").textContent = products.length;
}


/* SEND ORDER ON WHATSAPP */

function sendWhatsAppOrder(id) {

    const order = orders.find(item => String(item.id) === String(id));

    if (!order) {
        alert("Order nahi mila.");
        return;
    }

    let phone = String(order.customer.phone).replace(/\D/g, "");

    // Pakistan number ko international format mein convert karo
    if (phone.startsWith("0")) {
        phone = "92" + phone.substring(1);
    } else if (phone.startsWith("3")) {
        phone = "92" + phone;
    }

    if (!phone.startsWith("92") || phone.length !== 12) {
        alert("Customer ka WhatsApp number check karo.");
        return;
    }

    const productDetails = order.items.map(item => {

        return `${item.name} | Size: ${item.size} | Quantity: ${item.quantity} | Rs. ${item.price * item.quantity}`;

    }).join("\n");

    const message = `
Assalam o Alaikum ${order.customer.name}!

TY STYLE se aapka order receive ho gaya hai.

Order ID: ${order.id}

Order Details:
${productDetails}

Total Amount: Rs. ${order.total}

Delivery Address:
${order.customer.houseNo || ""}
${order.customer.address},
${order.customer.city},
${order.customer.province}

Agar aap apna order confirm karna chahte hain to is message ka reply CONFIRM karein.

Thank you!
TY STYLE
    `;

    const whatsappURL =
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    window.open(whatsappURL, "_blank");

}


/* UPDATE ORDER STATUS */

async function updateOrderStatus(id, status) {

    try {

        const response = await fetch(`/api/orders/${id}/status`, {

            method: "PATCH",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({ status: status })

        });

        const result = await response.json();

        if (!response.ok || !result.success) {

            alert("Order status update nahi hua.");

            loadOrders();

            return;
        }

        alert("Order status successfully update ho gaya!");

        loadOrders();

    } catch (error) {

        console.error(error);

        alert("Server se connection nahi ho saka.");

    }
}


/* LOAD CUSTOMER ORDERS */

async function loadOrders() {

    try {

        const response = await fetch("/orders.json");

        if (!response.ok) {
            throw new Error("Orders load nahi hue");
        }

        orders = await response.json();

        const list = document.getElementById("orders-list");

        list.innerHTML = "";

        let sales = 0;

        orders.forEach(order => {

            sales += Number(order.total);

            const div = document.createElement("div");

            div.className = "order";

            const currentStatus = order.status || "Pending";

            div.innerHTML = `

                <h3>Order #${order.id}</h3>

                <p>
                    <strong>Customer:</strong>
                    ${order.customer.name}
                </p>

                <p>
                    <strong>Phone:</strong>
                    ${order.customer.phone}
                </p>

                <p>
                    <strong>Address:</strong>
                    ${order.customer.address}
                </p>

                <p>
                    <strong>City:</strong>
                    ${order.customer.city}
                </p>

                <p>
                    <strong>Product:</strong>
                    ${order.items.map(item =>
                        `${item.name} (${item.size}) × ${item.quantity}`
                    ).join(", ")}
                </p>

                <p>
                    <strong>Total:</strong>
                    Rs. ${order.total}
                </p>

                <p>
                    <strong>Order Status:</strong>
                    ${currentStatus}
                </p>

                <button
                    class="whatsapp-btn"
                    onclick="sendWhatsAppOrder(${order.id})"
                >
                    Send WhatsApp Order
                </button>

                <br>

                <select class="status-select"
                    onchange="updateOrderStatus(${order.id}, this.value)">

                    <option value="Pending" ${currentStatus === "Pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Confirmed" ${currentStatus === "Confirmed" ? "selected" : ""}>
                        Confirmed
                    </option>

                    <option value="Shipped" ${currentStatus === "Shipped" ? "selected" : ""}>
                        Shipped
                    </option>

                    <option value="Delivered" ${currentStatus === "Delivered" ? "selected" : ""}>
                        Delivered
                    </option>

                </select>

            `;

            list.appendChild(div);

        });

        document.getElementById("order-count").textContent = orders.length;

        document.getElementById("total-sales").textContent = "Rs. " + sales;

    } catch (error) {

        console.error("Orders load error:", error);

    }
}


/* START */

loadProducts();
loadOrders();

</script>

</body>
</html>
